name: Build & Publish ApexConnect APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Signing Keystore (Fallback if Secrets not configured)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Generate debug.keystore required by debugConfig
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Configure release signing keystore (uses GitHub Secret if provided, or generates an ephemeral release keystore)
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass apexconnectrelease \
              -alias upload \
              -keypass apexconnectrelease \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ApexConnect,OU=Mobile,O=ApexConnect,L=Cairo,S=Cairo,C=EG"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=apexconnectrelease" >> $GITHUB_ENV
            echo "KEY_PASSWORD=apexconnectrelease" >> $GITHUB_ENV
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Signed Release & Debug APKs
        run: |
          gradle :app:assembleRelease :app:assembleDebug --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ApexConnect-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ApexConnect-debug.apk
          sha256sum dist/ApexConnect-release.apk dist/ApexConnect-debug.apk > dist/SHA256SUMS.txt

      - name: Upload APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexConnect-APKs
          path: |
            dist/ApexConnect-release.apk
            dist/ApexConnect-debug.apk
            dist/SHA256SUMS.txt

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "ApexConnect ${{ steps.tag_info.outputs.tag }}"
          body: |
            ## ApexConnect ${{ steps.tag_info.outputs.tag }}
            Unified Peer-to-Peer Android application combining **KDE Connect Protocol v8** with **Remote File Browsing (`kdeconnect.vfs.*`)** and **Persistent Device Chat & Notes (`kdeconnect.space.*`)**.

            ### Attached Installers
            - **`ApexConnect-release.apk`** — Signed Release APK ready to install on Android 7.0+ (API 24+).
            - **`ApexConnect-debug.apk`** — Debug APK build.
            - **`SHA256SUMS.txt`** — Cryptographic SHA-256 checksums for APK verification.
          files: |
            dist/ApexConnect-release.apk
            dist/ApexConnect-debug.apk
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
